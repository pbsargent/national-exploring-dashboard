name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public website
        run: |
          mkdir -p _site/src/assets _site/data
          cp index.html .nojekyll _site/
          cp src/index.html src/exploring-dashboard.css src/exploring-dashboard.js _site/src/
          cp src/assets/exploring-*.png _site/src/assets/
          cp data/national-exploring-dashboard-data.json data/national-exploring-posts.csv data/national-exploring-council-cst-map.csv _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
